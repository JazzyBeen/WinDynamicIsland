name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build WinDynamicIsland.sln --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/browser-lifecycle.test.cjs
      - shell: pwsh
        run: ./scripts/Build.ps1 -TestCore
